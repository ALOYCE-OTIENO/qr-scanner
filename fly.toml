app = "qr-scanner"
primary_region = "nrt"

[build]
  [build.args]
    PHP_VERSION = "8.1"

[env]
  APP_ENV = "production"
  APP_DEBUG = "false"
  APP_URL = "https://qr-scanner.fly.dev"
  LOG_CHANNEL = "errorlog"
  LOG_LEVEL = "error"
  CACHE_DRIVER = "file"
  SESSION_DRIVER = "file"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  interval = 15s
  timeout = 10s
  grace_period = "5s"
  method = "GET"
  path = "/"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
